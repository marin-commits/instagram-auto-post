name: Instagram Auto Post

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "A = 띠별운세, B = 별자리운세"
        required: true
        type: choice
        options:
          - A
          - B
      target_date:
        description: "운세 대상일 (YYYY-MM-DD). 비워두면 한국시간 기준 다음 날"
        required: false
        type: string
      dry_run:
        description: "실제 게시 없이 이미지·계정·캡션만 검사"
        required: true
        default: true
        type: boolean
      test_publish:
        description: "테스트 게시: 성공 기록을 남기지 않아 정규 예약 때 다시 게시"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: instagram-dispatch-${{ inputs.slot }}-${{ inputs.target_date || 'tomorrow' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      META_API_VERSION: v23.0
      AUTOMATED_RUN: false
      TARGET_DATE: ${{ inputs.target_date }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      TEST_PUBLISH: ${{ inputs.test_publish || 'false' }}
      SLOT: ${{ inputs.slot }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Publish Instagram feed image
        shell: bash
        run: node scripts/post-instagram.mjs
