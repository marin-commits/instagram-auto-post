name: Import next month's fortune images

on:
  schedule:
    # 09:00 KST on the 1st; the 2nd is a recovery attempt if the first run failed.
    - cron: "0 0 1,2 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate next month's ZIPs without uploading"
        required: true
        type: boolean
        default: true
      verify_existing:
        description: "Compare existing Supabase images with the source ZIPs (read-only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: instagram-monthly-fortunes
  cancel-in-progress: false

jobs:
  import:
    # The site renders each PNG in the browser with system fonts (skipFonts), so the
    # result depends on the OS. macOS renders with Apple SD Gothic Neo like the
    # images prepared by hand; Ubuntu falls back to wider Noto CJK and clips text.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # Failure alerts: bot DM to Marin (falls back to the channel webhook).
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_DM_USER_ID: U0A1RNJ0VJL
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      VERIFY_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_existing || 'false' }}
      COMPARE_SAMPLE_DIR: comparison-samples
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Download and upload next month's A and B images
        run: node scripts/import-monthly-fortunes.mjs
      - name: Keep comparison samples
        if: always() && env.VERIFY_EXISTING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: comparison-samples
          path: comparison-samples/
          retention-days: 7
          if-no-files-found: ignore
